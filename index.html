<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--neg:#000;--blanco:#fff;--linea:#e0e0e0;--gris:#767677;--foto:#eceff1;--gfondo:#f1f2f3;--rojo:#d81f26;--cond:"Oswald","Arial Narrow","Haettenschweiler","Roboto Condensed",Impact,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--blanco);color:var(--neg);-webkit-font-smoothing:antialiased;font-size:14px}
button{font-family:inherit;color:inherit}
/* barra negra superior */
.aviso{background:var(--neg);color:#fff;text-align:center;font-size:14px;font-weight:700;letter-spacing:.01em;text-transform:uppercase;padding:14px 12px;font-family:var(--cond);letter-spacing:.04em}
/* cabecera */
header{background:#fff;border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:20}
.hd{max-width:1500px;margin:0 auto;padding:6px 40px 10px;display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"links links links" "logo nav tools";align-items:center;gap:0 20px}
.enlaces{grid-area:links;display:flex;justify-content:flex-end;gap:20px;font-size:12px;color:#222;padding:2px 0}
.enlaces a{color:inherit;text-decoration:none}.enlaces a:hover{text-decoration:underline}
.logo{padding:0 .3em 9px 0;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;grid-area:logo;font-family:var(--cond);font-size:30px;font-weight:700;font-style:italic;text-transform:uppercase;letter-spacing:.01em;line-height:1.15;cursor:pointer;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px;color:inherit}
nav{min-width:0;overflow-x:auto;scrollbar-width:none;grid-area:nav;display:flex;gap:28px;font-size:17px;font-weight:700;justify-content:safe center;flex-wrap:nowrap}
nav button{background:transparent;border:0;padding:12px 0;font-size:inherit;font-weight:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button:hover,nav button.on{border-bottom-color:var(--neg)}
.tools{grid-area:tools;display:flex;justify-content:flex-end;align-items:center;gap:18px}
.buscar{position:relative;width:260px;min-width:120px}
.buscar input{width:100%;padding:11px 40px 11px 12px;border:0;background:var(--gfondo);font-size:15px;border-radius:0;outline:none;color:var(--neg)}
.buscar input:focus{box-shadow:inset 0 0 0 1px var(--neg)}
.buscar:after{content:"\2315";position:absolute;right:12px;top:50%;transform:translateY(-52%);font-size:22px;pointer-events:none}
.lupa{display:none;align-items:center;justify-content:center;width:44px;height:44px;background:transparent;border:0;cursor:pointer;color:var(--neg);font-size:30px;line-height:1;padding:0}
.wa{display:flex;align-items:center;justify-content:center;width:38px;height:38px;color:var(--neg);text-decoration:none;font-size:22px}
/* contenido */
.wrap{max-width:1380px;margin:0 auto;padding:0 40px}
.migas{display:flex;gap:10px;font-size:13px;padding:34px 0 18px;align-items:center}
.migas a,.migas button{color:var(--neg);background:none;border:0;padding:0;font-size:13px;cursor:pointer;text-decoration:underline}
.migas b{font-weight:700;text-decoration:underline}.migas span{color:var(--neg)}
h1.titulo{margin:0 0 22px;font-family:var(--cond);font-size:46px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
h1.titulo sup{display:none;font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;font-weight:600;margin-left:6px;vertical-align:top;position:relative;top:4px;letter-spacing:0}
.tabs{display:flex;gap:34px;border-bottom:1px solid var(--linea);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;border:0;padding:16px 0 15px;font-size:14px;letter-spacing:.02em;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;color:#222}
.tab:hover{border-bottom-color:#bbb}.tab.on{font-weight:700;border-bottom-color:var(--neg);color:var(--neg)}
.barra{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:16px 0}
.filtro-btn{background:#fff;border:1px solid var(--neg);padding:12px 16px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:18px;position:relative}
.filtro-btn svg{width:22px;height:18px}
.filtro-btn .n{position:absolute;top:-8px;right:-6px;background:var(--neg);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 3px}
.pills{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:12px;margin-top:-4px}
.pill{border:1px solid var(--neg);background:#fff;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer}
.pill:after{content:"  \2715";font-size:11px}.pill.limpiar{border-color:var(--linea);color:var(--gris)}.pill.limpiar:after{content:""}
/* tarjetas */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 4px}
.card{background:#fff;display:flex;flex-direction:column;border:1px solid transparent;min-width:0;padding-bottom:12px}
.card:hover{border-color:var(--neg)}
.foto{aspect-ratio:1/1;background:var(--foto);display:flex;align-items:center;justify-content:center;font-size:56px;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.info{padding:10px 8px 0;display:flex;flex-direction:column;gap:3px;flex:1}
.precio{font-size:13px;font-weight:700;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 0}
.cod,.marca{overflow-wrap:anywhere}
.nombre{font-size:13px;line-height:1.3;overflow-wrap:anywhere;text-transform:uppercase}
.marca{font-size:13px;color:var(--gris);text-transform:capitalize}
.cod{font-size:12px;color:var(--gris)}
.card{cursor:pointer}.card:focus-visible{outline:2px solid var(--neg);outline-offset:2px}
.btn{margin-top:12px;border:0;border-radius:0;background:var(--neg);color:#fff;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}
.btn:after{content:"\2192";font-size:20px;line-height:1}
/* ficha del modelo */
.det{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.5)}
.det.abierto{display:flex}
.det-in{align-content:start;background:#fff;width:min(1100px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:1.15fr 1fr;gap:36px;padding:24px;position:relative;border-radius:4px}
.det-foto{aspect-ratio:1/1;background:var(--foto);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:90px;overflow:hidden}
.det-foto img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.det-x{position:absolute;top:10px;right:12px;width:44px;height:44px;border:0;background:#fff;border-radius:50%;font-size:22px;cursor:pointer;z-index:2;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.det-info{display:flex;flex-direction:column;padding:34px 8px 8px 0;min-width:0}
.det-info h2{margin:0;font-size:22px;font-weight:500;line-height:1.2;overflow-wrap:anywhere}
.det-sub{color:var(--gris);font-size:16px;margin-top:4px;overflow-wrap:anywhere}
.det-pr{font-size:17px;margin:18px 0 26px}
.det-tt{display:flex;justify-content:space-between;font-size:17px;font-weight:600;margin-bottom:14px}
.det-tt span:last-child{font-size:13px;font-weight:400;color:var(--gris)}
.t-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.t{border:1px solid #cfcfcf;background:#fff;border-radius:4px;padding:15px 4px;font-size:17px;cursor:pointer;min-height:48px}
.t:hover:not([disabled]){border-color:var(--neg)}.t.on{border:2px solid var(--neg);padding:14px 3px}
.t[disabled]{background:#f4f4f4;color:#999;text-decoration:line-through;cursor:not-allowed;border-color:#e3e3e3}
.det-btn{margin-top:26px;border:0;border-radius:999px;background:#111;color:#fff;font-size:16px;font-weight:700;padding:19px;cursor:pointer}
.det-btn:hover:not([disabled]){background:#333}.det-btn[disabled]{background:#d9d9d9;color:#fff;cursor:not-allowed}
.det-nota{font-size:13px;color:var(--gris);margin-top:12px;text-align:center}
@media(max-width:800px){.det{padding:0;align-items:stretch;background:#fff}
 .det-in{display:flex;flex-direction:column;gap:14px;padding:12px 12px 24px;border-radius:0;width:100%;height:100vh;height:100dvh;max-height:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
 .det-foto{flex:none;width:100%;aspect-ratio:auto;height:min(calc(100vw - 24px),50vh);border-radius:8px}
 .det-info{flex:none;padding:0 4px}.det-x{position:fixed;top:10px;right:12px}}
.secs{display:flex;gap:10px;padding:0 0 16px;flex-wrap:wrap}
.sec{border:1px solid var(--neg);background:#fff;padding:11px 20px;font-size:14px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;font-family:var(--cond)}
.sec.on{background:var(--neg);color:#fff}.sec.promo{border-color:var(--rojo);color:var(--rojo)}.sec.promo.on{background:var(--rojo);color:#fff}
.ahora{color:var(--rojo);font-weight:700}.antes{color:var(--gris);text-decoration:line-through;font-weight:400;margin-left:6px}
.off{background:var(--rojo);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;margin-left:6px;border-radius:2px;white-space:nowrap;display:inline-block}
.foto{position:relative}.nuevo{position:absolute;top:8px;left:8px;background:var(--neg);color:#fff;font-size:11px;font-weight:700;letter-spacing:.05em;padding:4px 8px;text-transform:uppercase;z-index:1}
.btn:hover:not([disabled]){background:#333}
.btn[disabled]{background:#ececec;color:#9a9a9a;cursor:not-allowed}
.mas{display:block;margin:28px auto 60px;padding:15px 40px;border:1px solid var(--neg);border-radius:0;background:#fff;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.mas:hover{background:var(--neg);color:#fff}
.vacio{grid-column:1/-1;text-align:center;color:var(--gris);padding:80px 10px;font-size:15px}
footer{background:var(--neg);color:#fff;text-align:center;font-size:12px;padding:34px 14px;letter-spacing:.03em;margin-top:30px}
/* panel Filtrar y ordenar */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:49;opacity:0;pointer-events:none;transition:opacity .25s}
.velo.on{opacity:1;pointer-events:auto}
.side{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:100%;background:#fff;z-index:50;transform:translateX(100%);transition:transform .28s,visibility .28s;display:flex;flex-direction:column;visibility:hidden}
.side.abierto{transform:none;visibility:visible;box-shadow:-6px 0 24px rgba(0,0,0,.2)}
.side-hd{display:flex;align-items:center;justify-content:space-between;padding:20px 26px;border-bottom:1px solid var(--linea);font-family:var(--cond);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.side-hd button{background:transparent;border:0;font-size:26px;cursor:pointer;line-height:1}
.side-sc{overflow:auto;flex:1;padding:0 26px}
.grupo{border-bottom:1px solid var(--linea);padding:22px 0}
.grupo h3{margin:0 0 14px;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.rad{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;padding:9px 0;font-size:15px;text-align:left;cursor:pointer}
.rad:before{content:"";width:18px;height:18px;border:1.5px solid #777;border-radius:50%;flex:none}
.rad.on{font-weight:700}.rad.on:before{border-color:var(--neg);background:var(--neg);box-shadow:inset 0 0 0 3.5px #fff}
.tallas-g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tg{border:1px solid #c8c8c8;background:#fff;padding:13px 0;font-size:14px;font-weight:600;cursor:pointer}
.tg:hover{border-color:var(--neg)}.tg.on{background:var(--neg);color:#fff;border-color:var(--neg)}
.side-ft{padding:16px 26px 22px;border-top:1px solid var(--linea);display:flex;gap:12px}
.side-ft .btn{margin:0;flex:1;justify-content:center}.side-ft .btn:after{content:""}
.side-ft .sec{background:#fff;color:var(--neg);border:1px solid var(--neg);padding:14px 18px;font-size:12px;font-weight:700;text-transform:uppercase;cursor:pointer}
@media(pointer:coarse){.tg,.rad,.tab,.navb,.pill,.sec{min-height:44px;min-width:44px}.side-hd button{min-width:44px;min-height:44px}
 .migas button,.logo,.wa{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}.buscar input{min-height:44px}.tab{padding-left:6px;padding-right:6px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media print{.aviso,header .tools,.enlaces,.migas,.secs,nav,.tabs,.barra,.pills,.mas,.velo,.side,.btn,footer,.det{display:none!important}
 header{position:static}.card{break-inside:avoid;page-break-inside:avoid;border:1px solid #999}.grid{grid-template-columns:repeat(3,1fr)}
 .foto{aspect-ratio:4/3}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
/* adaptación a pantallas */
@media(max-width:1100px){
 .hd{grid-template-columns:auto 1fr;grid-template-areas:"logo tools" "nav nav";padding:8px 20px}.enlaces{display:none}
 nav{justify-content:flex-start;overflow-x:auto;gap:22px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
 .grid{grid-template-columns:repeat(3,1fr)}.wrap{padding:0 20px}
}
@media(max-width:700px){
 .aviso{font-size:12px;padding:11px 10px}
 .secs{padding:0 12px 14px;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.secs::-webkit-scrollbar{display:none}.sec{padding:11px 14px;flex:none;white-space:nowrap}
  .hd{padding:8px 12px 8px;gap:0 4px;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"logo lupa wa" "buscar buscar buscar"}
 .logo{font-size:26px;max-width:100%;min-width:0;padding-right:.35em;justify-self:start;align-self:center;text-align:left}
 .tools{display:contents}.lupa{display:flex;grid-area:lupa}.wa{grid-area:wa}
 .buscar{display:none;grid-area:buscar;width:100%;min-width:0;margin:6px 0 2px}.hd.buscando .buscar{display:block}.buscar input{min-width:0;padding-top:10px;padding-bottom:10px}
 nav{display:none}
 .wrap{padding:0}.migas{padding:16px 12px 10px}h1.titulo{font-size:32px;margin:0 12px 14px}
 .tabs{gap:24px;padding:0 12px}.barra{padding:12px;justify-content:stretch}.filtro-btn{width:100%;justify-content:space-between}
 .pills{padding:0 12px 12px}
 .grid{grid-template-columns:repeat(2,1fr);gap:2px}
 .info{padding:8px 8px 0}.btn{font-size:11px;padding:12px 10px}
 .side{width:100%}
}
</style></head><body>
